version: 2

models:
  - name: orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'invoiced',
                       'processing', 'unavailable', 'approved', 'created']

  - name: order_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: unit_price
        tests: [not_null]

  - name: customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]

  - name: products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]

  - name: sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: order_reviews
    columns:
      - name: review_id
        tests: [not_null]
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]