version: 2

models:
  - name: daily_revenue
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: gross_revenue
        tests: [not_null]
      - name: total_orders
        tests: [not_null]

  - name: seller_performance
    columns:
      - name: seller_id
        tests: [unique, not_null]
      - name: gross_revenue
        tests: [not_null]

  - name: customer_ltv
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['Champions', 'Loyal', 'Promising',
                       'At Risk', 'Lost', 'New']